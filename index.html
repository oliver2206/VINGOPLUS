<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bingo Fortune Flip</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #4c00ff, #00aaff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', sans-serif;
            position: relative;
        }
        /* Bingo balls background */
        
        .bingo-background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: -1;
        }
        
        .ball {
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            color: black;
            background: white;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            border: 3px solid black;
        }
        
        .ball span.letter {
            font-size: 16px;
            line-height: 1;
        }
        
        .ball span.number {
            font-size: 22px;
            line-height: 1;
        }
        /* Foreground content */
        
        .container {
            position: relative;
            text-align: center;
            z-index: 10;
        }
        
        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 20px;
            background: black;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff00;
            font-size: 2rem;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.6);
        }
        
        h1 {
            color: white;
            font-size: 2.3rem;
            letter-spacing: 2px;
            margin-bottom: 30px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.4);
        }
        /* Buttons */
        
        .buttons {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .buttons a {
            width: 220px;
            text-align: center;
            padding: 15px;
            background: #333;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
            transition: all 0.3s ease;
        }
        /* ✨ Highlight glow effect on hover */
        
        .buttons a:hover {
            background: #555;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.8), 0 4px 10px rgba(0, 0, 0, 0.5);
        }
    </style>
</head>

<body>

    <!-- Bouncing Bingo Balls -->
    <div class="bingo-background" id="bingoBackground"></div>

    <!-- Foreground content -->
    <div class="container">
        <div class="logo">🍀</div>
        <h1>BINGO FORTUNE </h1>
        <div class="buttons">
            <a href="./GENERATE.html">GENERATE</a>
            <a href="./PATTERN.html">PATTERN</a>
            <a href="./Untitled-4.html">CHECKER</a>
            <a href="./PATTERN.html">ANAYZER</a>
            <a href="./PATTERN.html">GALLERY</a>
        </div>
    </div>

    <script>
        const background = document.getElementById("bingoBackground");
        const balls = [];
        const speeds = [];

        // Create balls 1-75
        for (let i = 1; i <= 75; i++) {
            const ball = document.createElement("div");
            ball.classList.add("ball");

            const letterSpan = document.createElement("span");
            letterSpan.classList.add("letter");
            const numberSpan = document.createElement("span");
            numberSpan.classList.add("number");

            let letter = '';
            let bgColor = '';
            if (i <= 15) {
                letter = 'B';
                bgColor = '#4da6ff';
            } else if (i <= 30) {
                letter = 'I';
                bgColor = '#ff6666';
            } else if (i <= 45) {
                letter = 'N';
                bgColor = '#f0f0f0';
            } else if (i <= 60) {
                letter = 'G';
                bgColor = '#66ff99';
            } else {
                letter = 'O';
                bgColor = '#ffcc66';
            }

            letterSpan.textContent = letter;
            numberSpan.textContent = i;

            ball.style.background = bgColor;

            ball.appendChild(letterSpan);
            ball.appendChild(numberSpan);

            ball.style.top = Math.random() * (window.innerHeight - 80) + "px";
            ball.style.left = Math.random() * (window.innerWidth - 80) + "px";

            background.appendChild(ball);
            balls.push(ball);

            speeds.push({
                dx: (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 1.5),
                dy: (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.random() * 1.5)
            });
        }

        // Move balls
        function moveBalls() {
            balls.forEach((ball, i) => {
                let rect = ball.getBoundingClientRect();
                let x = rect.left + speeds[i].dx;
                let y = rect.top + speeds[i].dy;

                if (x <= 0 || x + rect.width >= window.innerWidth) speeds[i].dx *= -1;
                if (y <= 0 || y + rect.height >= window.innerHeight) speeds[i].dy *= -1;

                ball.style.left = (rect.left + speeds[i].dx) + "px";
                ball.style.top = (rect.top + speeds[i].dy) + "px";
            });
            requestAnimationFrame(moveBalls);
        }

        moveBalls();
    </script>

</body>

</html>
