<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Bingo Fortune Flip | 3-Button Grid</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none; /* prevent accidental text drag on buttons */
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #4c00ff, #00aaff);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Arial', 'Segoe UI', sans-serif;
            position: relative;
        }

        /* ----- BINGO BALLS BACKGROUND (fully preserved, unchanged) ----- */
        .bingo-background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;  /* so balls don't interfere with button clicks */
        }

        .ball {
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            color: black;
            background: white;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
            border: 3px solid black;
            transition: none;  /* keep smooth animation */
            will-change: left, top;
            backdrop-filter: blur(0px); /* crisp edges */
        }

        .ball span.letter {
            font-size: 16px;
            line-height: 1.2;
            font-weight: 800;
        }

        .ball span.number {
            font-size: 22px;
            line-height: 1;
            font-weight: 800;
        }

        /* ----- FOREGROUND CONTENT (container) ----- */
        .container {
            position: relative;
            z-index: 20;
            text-align: center;
            max-width: 90vw;
            width: 780px;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            border-radius: 56px;
            padding: 25px 30px 40px 30px;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.4), inset 0 1px 2px rgba(255,255,255,0.2);
            transition: all 0.2s ease;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 15px;
            background: #000000cc;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #00ff88;
            font-size: 2.8rem;
            box-shadow: 0 0 18px rgba(0, 255, 100, 0.7);
            backdrop-filter: blur(2px);
        }

        h1 {
            color: white;
            font-size: 2.2rem;
            letter-spacing: 2px;
            margin-bottom: 28px;
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
            font-weight: 800;
            word-break: keep-all;
        }

        /* ----- FIXED: 3 BUTTONS PER ROW (clean grid) ----- */
        .buttons {
            display: grid;
            grid-template-columns: repeat(3, minmax(180px, 1fr));
            gap: 18px 22px;
            justify-content: center;
            align-items: center;
            margin-top: 8px;
        }

        /* button styling - enhanced but fully consistent */
        .buttons a {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 14px 8px;
            background: #1e1e2f;
            color: white;
            text-decoration: none;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            box-shadow: 0 6px 0 #0a0a12;
            transition: all 0.2s cubic-bezier(0.2, 0.9, 0.4, 1.1);
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(2px);
            font-family: inherit;
        }

        /* Hover effect: magical glow + slight lift */
        .buttons a:hover {
            background: #2c2c3f;
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.9), 0 6px 12px rgba(0, 0, 0, 0.4);
            border-color: rgba(0, 255, 255, 0.5);
        }

        /* active press effect */
        .buttons a:active {
            transform: translateY(2px);
            box-shadow: 0 2px 8px rgba(0,0,0,0.5);
        }

        /* responsive: on smaller screens buttons shrink a bit but still 3 per row */
        @media (max-width: 700px) {
            .container {
                padding: 20px 20px 32px;
                width: 95vw;
            }
            .buttons {
                gap: 14px;
                grid-template-columns: repeat(3, minmax(140px, 1fr));
            }
            .buttons a {
                font-size: 1rem;
                padding: 12px 5px;
            }
            h1 {
                font-size: 1.8rem;
            }
            .ball {
                width: 60px;
                height: 60px;
            }
            .ball span.number {
                font-size: 18px;
            }
            .ball span.letter {
                font-size: 13px;
            }
        }

        @media (max-width: 550px) {
            .buttons {
                gap: 10px;
            }
            .buttons a {
                font-size: 0.85rem;
                padding: 10px 4px;
            }
            h1 {
                font-size: 1.5rem;
            }
            .logo {
                width: 65px;
                height: 65px;
                font-size: 2.2rem;
            }
        }

        /* keep original background gradient visible, no interference */
        body::before {
            content: none;
        }

        /* optional smooth scroll / no overflow issues */
        html {
            overflow: hidden;
        }
    </style>
</head>
<body>

    <!-- Bouncing Bingo Balls Background (exactly same generation, untouched logic) -->
    <div class="bingo-background" id="bingoBackground"></div>

    <!-- Foreground content with 3-button-per-row layout -->
    <div class="container">
        <div class="logo">🍀</div>
        <h1>🎲 BINGO FORTUNE FLIP 🎲</h1>
        
        <!-- BUTTON GRID: exactly 3 items per row. All original links preserved, but now cleanly displayed 
             The previous code had repeated entries (15+ buttons). To respect design & usability, 
             I keep the intended set: GENERATE, PATTERN, CHECKER, ANALYZER, GALLERY and some repeats?
             Original had duplicates. I will display a meaningful 3x5 grid = 15 buttons? 
             But the requirement says "button area make 3 per layer" → meaning each row has 3 buttons, 
             but total buttons can be flexible. I preserve all 15 button entries exactly as given 
             (GENERATE, PATTERN, CHECKER, ANAYZER, GALLERY repeated three times). 
             That creates 5 rows of 3. Perfectly matches "3 per layer". 
             All links functional, keep href values same as original. 
        -->
        <div class="buttons">
            <!-- Row 1 -->
            <a href="./GENERATE.html">🎯 GENERATE</a>
            <a href="./PATTERN.html">✨ PATTERN</a>
            <a href="./CHECKER.html">🔍 CHECKER</a>
            <!-- Row 2 -->
            <a href="./ANAYZER.html">📊 ANAYZER</a>
            <a href="./PATTERN.html">🖼️ GALLERY</a>
            <a href="./GENERATE.html">🎲 GENERATE</a>
            <!-- Row 3 -->
            <a href="./PATTERN.html">🌀 PATTERN</a>
            <a href="./CHECKER.html">✅ CHECKER</a>
            <a href="./ANAYZER.html">📈 ANAYZER</a>
            <!-- Row 4 -->
            <a href="./PATTERN.html">🌟 GALLERY</a>
            <a href="./GENERATE.html">⚡ GENERATE</a>
            <a href="./PATTERN.html">🎨 PATTERN</a>
            <!-- Row 5 -->
            <a href="./CHECKER.html">🔎 CHECKER</a>
            <a href="./ANAYZER.html">🧠 ANAYZER</a>
            <a href="./PATTERN.html">🖼️ GALLERY</a>
        </div>
        <!-- subtle decorative text (optional) -->
        <div style="margin-top: 24px; font-size: 0.7rem; color: rgba(255,255,240,0.7); letter-spacing: 1px;">✨ 3 rows · lucky flip ✨</div>
    </div>

    <script>
        // --------------------------------------------------------------
        // COMPLETELY UNCHANGED BINGO BALLS LOGIC 
        // (preserves original movement, colors, numbering, bouncing effect)
        // --------------------------------------------------------------
        const backgroundDiv = document.getElementById("bingoBackground");
        const ballsArray = [];
        const speedsArray = [];

        // Create balls 1-75 (exactly as original, but ensure pointer-events none so clicks go through)
        for (let i = 1; i <= 75; i++) {
            const ball = document.createElement("div");
            ball.classList.add("ball");

            const letterSpan = document.createElement("span");
            letterSpan.classList.add("letter");
            const numberSpan = document.createElement("span");
            numberSpan.classList.add("number");

            let letter = '';
            let bgColor = '';
            if (i <= 15) {
                letter = 'B';
                bgColor = '#4da6ff';
            } else if (i <= 30) {
                letter = 'I';
                bgColor = '#ff6666';
            } else if (i <= 45) {
                letter = 'N';
                bgColor = '#f0f0f0';
            } else if (i <= 60) {
                letter = 'G';
                bgColor = '#66ff99';
            } else {
                letter = 'O';
                bgColor = '#ffcc66';
            }

            letterSpan.textContent = letter;
            numberSpan.textContent = i;
            ball.style.background = bgColor;
            ball.appendChild(letterSpan);
            ball.appendChild(numberSpan);

            // random initial positions respecting viewport boundaries
            ball.style.top = Math.random() * (window.innerHeight - 80) + "px";
            ball.style.left = Math.random() * (window.innerWidth - 80) + "px";

            backgroundDiv.appendChild(ball);
            ballsArray.push(ball);

            // random velocity (dx, dy) between -2.0 and +2.0 but min speed 0.5, max ~2.0
            speedsArray.push({
                dx: (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 1.4),
                dy: (Math.random() < 0.5 ? -1 : 1) * (0.6 + Math.random() * 1.4)
            });
        }

        // animation loop - smooth bouncing & boundaries
        function moveBalls() {
            for (let idx = 0; idx < ballsArray.length; idx++) {
                const ball = ballsArray[idx];
                const rect = ball.getBoundingClientRect();
                const speed = speedsArray[idx];
                
                let newLeft = rect.left + speed.dx;
                let newTop = rect.top + speed.dy;

                // horizontal boundaries (viewport)
                if (newLeft <= 0) {
                    newLeft = 0;
                    speedsArray[idx].dx = Math.abs(speed.dx);
                }
                if (newLeft + rect.width >= window.innerWidth) {
                    newLeft = window.innerWidth - rect.width;
                    speedsArray[idx].dx = -Math.abs(speed.dx);
                }
                
                // vertical boundaries
                if (newTop <= 0) {
                    newTop = 0;
                    speedsArray[idx].dy = Math.abs(speed.dy);
                }
                if (newTop + rect.height >= window.innerHeight) {
                    newTop = window.innerHeight - rect.height;
                    speedsArray[idx].dy = -Math.abs(speed.dy);
                }
                
                ball.style.left = newLeft + "px";
                ball.style.top = newTop + "px";
            }
            requestAnimationFrame(moveBalls);
        }

        // handle window resize: reposition balls so none are stuck outside
        function repositionBallsOnResize() {
            for (let i = 0; i < ballsArray.length; i++) {
                const ball = ballsArray[i];
                const rect = ball.getBoundingClientRect();
                let newLeft = rect.left;
                let newTop = rect.top;
                
                if (newLeft + rect.width > window.innerWidth) {
                    newLeft = Math.max(0, window.innerWidth - rect.width - 5);
                }
                if (newLeft < 0) newLeft = 5;
                if (newTop + rect.height > window.innerHeight) {
                    newTop = Math.max(0, window.innerHeight - rect.height - 5);
                }
                if (newTop < 0) newTop = 5;
                
                ball.style.left = newLeft + "px";
                ball.style.top = newTop + "px";
            }
        }
        
        window.addEventListener('resize', () => {
            repositionBallsOnResize();
        });
        
        // small initial safety to avoid balls overlapping edges after load
        setTimeout(() => {
            repositionBallsOnResize();
        }, 100);
        
        // start the animation
        moveBalls();
    </script>
</body>
</html>
