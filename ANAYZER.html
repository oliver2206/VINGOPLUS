<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Bingo Called Numbers</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --purple-900: #26215C;
    --purple-800: #3C3489;
    --purple-600: #534AB7;
    --purple-400: #7F77DD;
    --purple-200: #AFA9EC;
    --purple-50:  #EEEDFE;
    --teal-600:   #0F6E56;
    --teal-400:   #1D9E75;
    --amber-600:  #854F0B;
    --red-600:    #A32D2D;
    --red-400:    #E24B4A;
    --red-50:     #FCEBEB;
    --gray-50:    #f9fafb;
    --gray-100:   #f3f4f6;
    --gray-200:   #e5e7eb;
    --gray-300:   #d1d5db;
    --gray-500:   #6b7280;
    --gray-700:   #374151;
    --gray-900:   #111;
    --col-b: #1D9E75; --col-b-bg: #E1F5EE;
    --col-i: #378ADD; --col-i-bg: #E6F1FB;
    --col-n: #7F77DD; --col-n-bg: #EEEDFE;
    --col-g: #BA7517; --col-g-bg: #FAEEDA;
    --col-o: #D85A30; --col-o-bg: #FAECE7;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: #f5f4f0;
    min-height: 100vh;
    padding: 1.5rem 1rem 3rem;
    color: var(--gray-900);
  }

  .wrap {
    max-width: 900px;
    margin: 0 auto;
  }

  /* ── top bar ── */
  .top-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 1.25rem;
  }
  .title {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 600;
    color: var(--gray-900);
    letter-spacing: -0.02em;
  }
  .round-pill {
    background: var(--gray-100);
    border: 0.5px solid var(--gray-300);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 12px;
    color: var(--gray-500);
  }

  /* ── label box ── */
  .label-box {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--purple-50);
    border: 0.5px solid var(--purple-200);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 1.25rem;
    min-height: 52px;
    transition: border-color 0.15s;
  }
  .label-box:focus-within {
    border-color: var(--purple-400);
  }
  .label-icon {
    font-size: 16px;
    flex-shrink: 0;
    line-height: 1;
  }
  .label-display {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
  }
  .label-text {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--purple-800);
    word-break: break-word;
  }
  .label-placeholder {
    flex: 1;
    font-size: 13px;
    color: var(--purple-400);
    font-style: italic;
  }
  .label-edit-btn {
    padding: 5px 14px;
    border-radius: 8px;
    border: 0.5px solid var(--purple-400);
    background: white;
    color: var(--purple-600);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
    transition: background 0.12s;
  }
  .label-edit-btn:hover { background: var(--purple-50); }
  .label-form {
    display: flex;
    gap: 8px;
    flex: 1;
  }
  .label-input {
    flex: 1;
    padding: 6px 10px;
    border-radius: 8px;
    border: 0.5px solid var(--purple-200);
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    outline: none;
    color: var(--purple-900);
    background: white;
    transition: border-color 0.15s;
  }
  .label-input:focus { border-color: var(--purple-400); }
  .label-save-btn {
    padding: 6px 14px;
    border-radius: 8px;
    border: 0.5px solid var(--purple-600);
    background: var(--purple-600);
    color: var(--purple-50);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    cursor: pointer;
    flex-shrink: 0;
  }
  .label-cancel-btn {
    padding: 6px 10px;
    border-radius: 8px;
    border: 0.5px solid var(--gray-300);
    background: white;
    color: var(--gray-500);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    flex-shrink: 0;
  }
  .hidden { display: none !important; }

  /* ── max balls bar ── */
  .max-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    background: var(--gray-50);
    border: 0.5px solid var(--gray-200);
    border-radius: 12px;
    padding: 12px 16px;
    margin-bottom: 1.25rem;
  }
  .max-label { font-size: 12px; color: var(--gray-500); white-space: nowrap; }
  .max-opts { display: flex; gap: 6px; flex-wrap: wrap; }
  .max-btn {
    padding: 5px 16px;
    border-radius: 20px;
    border: 0.5px solid var(--gray-300);
    background: white;
    color: var(--gray-700);
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    cursor: pointer;
    transition: all 0.15s;
  }
  .max-btn.active {
    border-color: var(--purple-600);
    background: var(--purple-600);
    color: var(--purple-50);
    font-weight: 500;
  }

  /* ── progress ── */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 1.25rem;
  }
  .track {
    flex: 1;
    height: 6px;
    background: var(--gray-200);
    border-radius: 3px;
    overflow: hidden;
  }
  .fill {
    height: 100%;
    background: var(--purple-600);
    border-radius: 3px;
    transition: width 0.2s;
    width: 0%;
  }
  .prog-txt { font-size: 12px; color: var(--gray-500); white-space: nowrap; min-width: 64px; text-align: right; }

  /* ── legend ── */
  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 1.25rem;
  }
  .leg-item { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--gray-500); }
  .leg-dot {
    width: 14px; height: 14px; border-radius: 3px;
    border: 0.5px solid transparent;
  }

  /* ── manual input ── */
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .num-input {
    flex: 1;
    padding: 8px 12px;
    border-radius: 8px;
    border: 0.5px solid var(--gray-300);
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    outline: none;
    color: var(--gray-900);
    background: white;
    transition: border-color 0.15s;
  }
  .num-input:focus { border-color: var(--purple-400); }
  .highlight-btn {
    padding: 8px 18px;
    border-radius: 8px;
    border: 0.5px solid var(--purple-600);
    background: var(--purple-600);
    color: var(--purple-50);
    font-size: 13px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    cursor: pointer;
  }

  /* ── col headers ── */
  .col-hdrs {
    display: flex;
    gap: 2px;
    margin-bottom: 6px;
  }
  .col-hdr {
    flex: 0 0 calc(20% - 2px);
    text-align: center;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 0;
    border-radius: 4px;
    line-height: 1.4;
  }

  /* ── ball grid ── */
  .grid {
    display: grid;
    grid-template-columns: repeat(15, 1fr);
    gap: 4px;
    margin-bottom: 1.25rem;
  }
  .ball {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    aspect-ratio: 1;
    border-radius: 50%;
    cursor: pointer;
    user-select: none;
    transition: all 0.12s;
    border: 0.5px solid var(--gray-200);
    background: white;
  }
  .ball:hover { transform: scale(1.08); }
  .ball.active {
    border-color: var(--purple-800);
    background: var(--purple-600);
  }
  .ball.prev {
    border-color: var(--purple-200);
    background: var(--purple-50);
  }
  .ball-num {
    font-size: 11px;
    font-weight: 500;
    line-height: 1;
    color: #9ca3af;
  }
  .ball.active .ball-num { color: var(--purple-50); }
  .ball.prev  .ball-num  { color: var(--purple-800); }
  .ball-badge {
    font-size: 9px;
    padding: 1px 4px;
    border-radius: 8px;
    margin-top: 1px;
    font-weight: 500;
    line-height: 1.2;
    background: var(--purple-200);
    color: var(--purple-900);
  }
  .ball.active .ball-badge { background: var(--purple-800); color: var(--purple-50); }
  .ball-badge.multi { background: var(--red-400); color: var(--red-50); }

  /* ── actions ── */
  .actions {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .act-btn {
    padding: 9px 8px;
    border-radius: 8px;
    background: white;
    font-size: 12px;
    font-family: 'DM Mono', monospace;
    font-weight: 500;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
  }
  .act-btn:hover { opacity: 0.8; }

  /* ── stats ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 1.25rem;
  }
  .stat-box {
    background: var(--gray-50);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: center;
  }
  .stat-val { font-size: 20px; font-weight: 500; color: var(--gray-900); font-family: 'Fraunces', serif; }
  .stat-lbl { font-size: 11px; color: var(--gray-500); margin-top: 2px; }

  /* ── summary ── */
  .summary {
    background: var(--gray-50);
    border: 0.5px solid var(--gray-200);
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 12px;
    color: var(--gray-500);
    display: none;
  }
  .summary.visible { display: block; }
  .sum-row { margin-top: 6px; }
  .sum-bold { color: var(--gray-900); font-weight: 500; }

  @media (max-width: 500px) {
    .stats-row { grid-template-columns: repeat(2, 1fr); }
    .ball-num { font-size: 9px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <!-- top bar -->
  <div class="top-bar">
    <span class="title">Called numbers</span>
    <span class="round-pill" id="roundPill">Round 1</span>
  </div>

  <!-- label box -->
  <div class="label-box" id="labelBox">
    <span class="label-icon">🏷️</span>
    <!-- display mode -->
    <div class="label-display" id="labelDisplay">
      <span class="label-placeholder" id="labelPlaceholder">No label set — add a game name, event, or date</span>
      <span class="label-text hidden" id="labelText"></span>
      <button class="label-edit-btn" id="labelEditBtn" onclick="startEdit()">+ Add label</button>
    </div>
    <!-- edit mode -->
    <div class="label-form hidden" id="labelForm">
      <input class="label-input" id="labelInput" type="text" maxlength="80"
        placeholder="e.g. Friday Night Game · Hall B · June 2025"
        onkeydown="if(event.key==='Enter')saveLabel()" />
      <button class="label-save-btn" onclick="saveLabel()">Save</button>
      <button class="label-cancel-btn" onclick="cancelEdit()">✕</button>
    </div>
  </div>

  <!-- max balls -->
  <div class="max-bar">
    <span class="max-label">Max balls / round</span>
    <div class="max-opts" id="maxOpts"></div>
  </div>

  <!-- progress -->
  <div class="progress-row">
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="prog-txt" id="progTxt">0 / 48</span>
  </div>

  <!-- legend -->
  <div class="legend">
    <div class="leg-item">
      <div class="leg-dot" style="background:#534AB7;border-color:#3C3489"></div> Called this round
    </div>
    <div class="leg-item">
      <div class="leg-dot" style="background:#EEEDFE;border-color:#AFA9EC"></div> Previous rounds
    </div>
    <div class="leg-item">
      <div class="leg-dot" style="background:white;border-color:#e5e7eb"></div> Not called
    </div>
  </div>

  <!-- manual input -->
  <div class="input-row">
    <input class="num-input" id="numInput" type="number" min="1" max="75"
      placeholder="Enter 1–75 and press Enter"
      onkeydown="if(event.key==='Enter')highlightNum()" />
    <button class="highlight-btn" onclick="highlightNum()">Highlight</button>
  </div>

  <!-- col headers -->
  <div class="col-hdrs" id="colHdrs"></div>

  <!-- ball grid -->
  <div class="grid" id="grid"></div>

  <!-- actions -->
  <div class="actions">
    <button class="act-btn" style="border:0.5px solid #0F6E56;color:#0F6E56" onclick="drawRandom()">Draw random</button>
    <button class="act-btn" style="border:0.5px solid #854F0B;color:#854F0B" onclick="newRound()">New round</button>
    <button class="act-btn" style="border:0.5px solid #A32D2D;color:#A32D2D" onclick="resetRound()">Reset</button>
  </div>

  <!-- stats -->
  <div class="stats-row" id="statsRow"></div>

  <!-- summary -->
  <div class="summary" id="summary">
    <span class="sum-bold">Frequency summary</span>
    <div class="sum-row"><span class="sum-bold">Multiple hits:</span> <span id="multiHits">—</span></div>
    <div class="sum-row"><span class="sum-bold">Top 5 most frequent:</span> <span id="top5"></span></div>
  </div>

</div>

<script>
  const MAX_BALL_OPTIONS = [25, 30, 35, 40, 44, 48];
  const COLS = ["B","I","N","G","O"];
  const COL_COLORS = ["#1D9E75","#378ADD","#7F77DD","#BA7517","#D85A30"];
  const COL_LIGHT  = ["#E1F5EE","#E6F1FB","#EEEDFE","#FAEEDA","#FAECE7"];

  let maxBalls = 48;
  let called   = [];
  let history  = [];
  let round    = 1;
  let labelVal = "";

  // ── label ────────────────────────────────────────────────────────────────
  function startEdit() {
    document.getElementById('labelDisplay').classList.add('hidden');
    const form = document.getElementById('labelForm');
    form.classList.remove('hidden');
    const inp = document.getElementById('labelInput');
    inp.value = labelVal;
    inp.focus();
  }
  function saveLabel() {
    const v = document.getElementById('labelInput').value.trim();
    labelVal = v;
    document.getElementById('labelForm').classList.add('hidden');
    document.getElementById('labelDisplay').classList.remove('hidden');
    const ph  = document.getElementById('labelPlaceholder');
    const txt = document.getElementById('labelText');
    const btn = document.getElementById('labelEditBtn');
    if (v) {
      ph.classList.add('hidden');
      txt.classList.remove('hidden');
      txt.textContent = v;
      btn.textContent = 'Edit';
    } else {
      ph.classList.remove('hidden');
      txt.classList.add('hidden');
      btn.textContent = '+ Add label';
    }
  }
  function cancelEdit() {
    document.getElementById('labelForm').classList.add('hidden');
    document.getElementById('labelDisplay').classList.remove('hidden');
  }

  // ── freq ──────────────────────────────────────────────────────────────────
  function getFreq() {
    const f = {};
    for (let i = 1; i <= 75; i++) f[i] = 0;
    history.forEach(r => r.forEach(n => f[n]++));
    called.forEach(n => f[n]++);
    return f;
  }

  // ── build max buttons ─────────────────────────────────────────────────────
  function buildMaxOpts() {
    const el = document.getElementById('maxOpts');
    el.innerHTML = '';
    MAX_BALL_OPTIONS.forEach(opt => {
      const b = document.createElement('button');
      b.className = 'max-btn' + (opt === maxBalls ? ' active' : '');
      b.textContent = opt;
      b.onclick = () => { maxBalls = opt; buildMaxOpts(); render(); };
      el.appendChild(b);
    });
  }

  // ── build col headers ─────────────────────────────────────────────────────
  function buildColHdrs() {
    const el = document.getElementById('colHdrs');
    el.innerHTML = '';
    COLS.forEach((l, i) => {
      const d = document.createElement('div');
      d.className = 'col-hdr';
      d.style.background = COL_LIGHT[i];
      d.style.color = COL_COLORS[i];
      d.innerHTML = `${l}<br><span style="font-size:10px;font-weight:400">${i*15+1}–${i*15+15}</span>`;
      el.appendChild(d);
    });
  }

  // ── toggle ────────────────────────────────────────────────────────────────
  function toggle(n) {
    if (called.includes(n)) {
      called = called.filter(x => x !== n);
    } else {
      if (called.length >= maxBalls) { alert(`Max ${maxBalls} balls reached. Start a new round.`); return; }
      called.push(n);
      called.sort((a, b) => a - b);
    }
    render();
  }

  function highlightNum() {
    const v = parseInt(document.getElementById('numInput').value);
    if (isNaN(v) || v < 1 || v > 75) { alert('Enter a number between 1 and 75'); return; }
    toggle(v);
    document.getElementById('numInput').value = '';
  }

  function drawRandom() {
    const avail = Array.from({length:75},(_,i)=>i+1).filter(n => !called.includes(n));
    if (!avail.length) { alert('All 75 balls drawn!'); return; }
    if (called.length >= maxBalls) { alert(`Max ${maxBalls} balls reached. Start a new round.`); return; }
    const pick = avail[Math.floor(Math.random() * avail.length)];
    called.push(pick);
    called.sort((a,b)=>a-b);
    render();
  }

  function newRound() {
    if (!called.length) { alert('No balls drawn in current round.'); return; }
    history.push([...called]);
    called = [];
    round++;
    render();
  }

  function resetRound() {
    called = [];
    render();
  }

  // ── render ────────────────────────────────────────────────────────────────
  function render() {
    const freq = getFreq();
    const pct  = maxBalls > 0 ? Math.min(100, Math.round(called.length / maxBalls * 100)) : 0;

    // round pill
    document.getElementById('roundPill').textContent = `Round ${round}`;

    // progress
    document.getElementById('fill').style.width = pct + '%';
    document.getElementById('progTxt').textContent = `${called.length} / ${maxBalls}`;

    // grid
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    for (let n = 1; n <= 75; n++) {
      const active = called.includes(n);
      const inPrev = !active && freq[n] > 0;
      const total  = freq[n] || 0;

      const div = document.createElement('div');
      div.className = 'ball' + (active ? ' active' : inPrev ? ' prev' : '');
      div.onclick = () => toggle(n);

      const numSpan = document.createElement('span');
      numSpan.className = 'ball-num';
      numSpan.textContent = n;
      div.appendChild(numSpan);

      if (total > 0) {
        const badge = document.createElement('span');
        badge.className = 'ball-badge' + (total > 1 ? ' multi' : '');
        badge.textContent = total + 'x';
        div.appendChild(badge);
      }

      grid.appendChild(div);
    }

    // stats
    const statsRow = document.getElementById('statsRow');
    const stats = [
      { val: called.length,      lbl: 'Drawn' },
      { val: 75 - called.length, lbl: 'Remaining' },
      { val: history.length,     lbl: 'Rounds done' },
      { val: maxBalls,           lbl: 'Max / round' },
    ];
    statsRow.innerHTML = '';
    stats.forEach(({val, lbl}) => {
      statsRow.innerHTML += `<div class="stat-box"><div class="stat-val">${val}</div><div class="stat-lbl">${lbl}</div></div>`;
    });

    // summary
    const hasAny = Object.values(freq).some(v => v > 0);
    const summaryEl = document.getElementById('summary');
    if (hasAny) {
      summaryEl.classList.add('visible');
      const multi = Object.entries(freq).filter(([,c])=>c>1).map(([n,c])=>`${n}(${c}x)`).join(', ') || '—';
      const top5  = Object.entries(freq).filter(([,c])=>c>0).sort((a,b)=>b[1]-a[1]).slice(0,5).map(([n,c])=>`${n}(${c}x)`).join(', ') || '—';
      document.getElementById('multiHits').textContent = multi;
      document.getElementById('top5').textContent = top5;
    } else {
      summaryEl.classList.remove('visible');
    }
  }

  // ── init ──────────────────────────────────────────────────────────────────
  buildMaxOpts();
  buildColHdrs();
  render();
</script>
</body>
</html>
