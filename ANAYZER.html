<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Bingo Multi-Card Generator</title>
<style>
  :root{
    --bg:#6b2b6e;
    --panel:#f6f0f4;
    --purple:#4a1bd6;
    --white:#fff;
    --muted:#e9e6ea;
    --yellow:#ffd93d;
    font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
  }
  body{
    margin:0;
    min-height:100vh;
    background: linear-gradient(180deg,#5b254f, #8f3a4f);
    color:#222;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:28px;
    box-sizing:border-box;
  }
  .app{
    width:100%;
    max-width:920px;
    background:rgba(255,255,255,0.06);
    border-radius:16px;
    padding:20px;
    box-shadow:0 8px 30px rgba(0,0,0,0.4);
    color:var(--white);
  }
  .controls{
    display:flex;
    gap:12px;
    align-items:center;
    margin-bottom:12px;
  }
  label{font-size:14px; color:#fff;}
  input[type="number"], input[type="text"]{
    padding:8px 10px;
    border-radius:8px;
    border:none;
    outline:none;
    width:84px;
  }
  button{
    background:var(--purple);
    color:var(--white);
    border:none;
    padding:10px 14px;
    border-radius:10px;
    cursor:pointer;
    font-weight:600;
  }
  .cards{
    margin-top:12px;
    display:flex;
    gap:12px;
    flex-wrap:wrap;
  }
  .card{
    background:var(--panel);
    color:#222;
    width:220px;
    border-radius:12px;
    padding:14px;
    box-sizing:border-box;
    box-shadow:0 6px 18px rgba(0,0,0,0.25);
  }
  .card h3{
    margin:0 0 8px 0;
    font-size:16px;
    color: #222;
    text-align:center;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    background:transparent;
  }
  .cell{
    height:46px;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:700;
    font-size:16px;
    background:var(--white);
  }
  .header-cell{
    background:transparent;
    color:#8a8a8a;
    font-weight:700;
    height:auto;
    padding:4px 0;
  }
  .input-cell{
    background:var(--purple);
    color:var(--white);
  }
  .auto-cell{
    background:var(--white);
    color:#222;
    font-weight:700;
  }
  .free{
    background:var(--yellow);
    color:#000;
  }
  .legend{
    margin-top:10px;
    display:flex;
    gap:12px;
    align-items:center;
    color:#fff;
    font-size:13px;
  }
  .swatch{ width:16px;height:16px;border-radius:4px; display:inline-block; margin-right:6px;}
  .footer-note{ margin-top:12px;color:#eee;font-size:13px;}
  /* make inputs inside card look like purple boxes for the master input area */
  .master-grid{
    display:grid;
    grid-template-columns:repeat(5,1fr);
    gap:8px;
    width:360px;
    margin-bottom:14px;
  }
  .master-cell{
    height:54px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--panel);
  }
  .master-input{
    width:86%;
    height:78%;
    border-radius:8px;
    border:none;
    background:var(--purple);
    color:#fff;
    text-align:center;
    font-weight:700;
    font-size:16px;
    outline:none;
  }
  .header-row{
    display:flex;
    gap:8px;
    justify-content:center;
    margin-bottom:8px;
  }
  .colheader{
    width:66px;
    text-align:center;
    font-weight:800;
    color:#fff;
    opacity:0.9;
  }

  @media(max-width:760px){
    .app{ padding:12px;}
    .master-grid{ width:100%; grid-template-columns:repeat(5,1fr);}
    .card{ width:48%;}
  }
  @media(max-width:420px){
    .card{ width:100%;}
    .colheader{font-size:12px;}
  }
</style>
</head>
<body>
  <div class="app" role="main" aria-label="Bingo generator">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">
      <h2 style="margin:0;color:#fff">Bingo — Multi-card generator</h2>
      <div style="color:#fff;font-size:13px">Free is center (N3)</div>
    </div>

    <div style="margin-top:12px;display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;">
      <div>
        <div style="margin-bottom:6px;color:#fff">Cards to generate</div>
        <input id="cardsCount" type="number" min="1" max="100" value="3" />
      </div>

      <div>
        <div style="margin-bottom:6px;color:#fff">Seed (optional)</div>
        <input id="seed" type="text" placeholder="leave blank for random" />
      </div>

      <div style="display:flex;align-items:flex-end;">
        <button id="generateBtn">Generate</button>
      </div>
    </div>

    <div style="margin-top:18px;">
      <div class="colheader" style="display:flex;gap:6px;justify-content:center;">
        <div style="width:66px;text-align:center">B</div>
        <div style="width:66px;text-align:center">I</div>
        <div style="width:66px;text-align:center">N</div>
        <div style="width:66px;text-align:center">G</div>
        <div style="width:66px;text-align:center">O</div>
      </div>

      <div style="margin:6px 0 10px 0;">
        <div class="master-grid" id="masterGrid" aria-label="Master Bingo inputs (optional)">
          <!-- 25 master inputs -->
          <!-- Row 1 -->
          <div class="master-cell"><input class="master-input" data-pos="r0c0" placeholder="B1" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r0c1" placeholder="I1" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r0c2" placeholder="N1" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r0c3" placeholder="G1" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r0c4" placeholder="O1" /></div>
          <!-- Row 2 -->
          <div class="master-cell"><input class="master-input" data-pos="r1c0" placeholder="B2" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r1c1" placeholder="I2" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r1c2" placeholder="N2" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r1c3" placeholder="G2" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r1c4" placeholder="O2" /></div>
          <!-- Row 3 -->
          <div class="master-cell"><input class="master-input" data-pos="r2c0" placeholder="B3" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r2c1" placeholder="I3" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r2c2" placeholder="FREE" value="FREE" disabled /></div>
          <div class="master-cell"><input class="master-input" data-pos="r2c3" placeholder="G3" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r2c4" placeholder="O3" /></div>
          <!-- Row 4 -->
          <div class="master-cell"><input class="master-input" data-pos="r3c0" placeholder="B4" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r3c1" placeholder="I4" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r3c2" placeholder="N4" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r3c3" placeholder="G4" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r3c4" placeholder="O4" /></div>
          <!-- Row 5 -->
          <div class="master-cell"><input class="master-input" data-pos="r4c0" placeholder="B5" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r4c1" placeholder="I5" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r4c2" placeholder="N5" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r4c3" placeholder="G5" /></div>
          <div class="master-cell"><input class="master-input" data-pos="r4c4" placeholder="O5" /></div>
        </div>
      </div>
    </div>

    <div class="legend">
      <div><span class="swatch" style="background:var(--purple)"></span> Input values</div>
      <div><span class="swatch" style="background:var(--white)"></span> Auto-filled</div>
      <div><span class="swatch" style="background:var(--yellow)"></span> Free space</div>
    </div>

    <div class="cards" id="cards" aria-live="polite"></div>

    <div class="footer-note">Enter values into the master grid (optional). Leave blank to auto-fill numbers automatically from each column's range. Then click Generate.</div>
  </div>

  <script>
    const columnRanges = [
      {min:1, max:15},   // B
      {min:16, max:30},  // I
      {min:31, max:45},  // N
      {min:46, max:60},  // G
      {min:61, max:75}   // O
    ];

    function mulberry32(seed) {
      let a = seed >>> 0;
      return function() {
        a |= 0;
        a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    function seededShuffle(array, rand) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(rand() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function createRange(min, max) {
      const arr = [];
      for (let i = min; i <= max; i++) arr.push(i);
      return arr;
    }

    function readMasterGrid() {
      const inputs = document.querySelectorAll('.master-input');
      const grid = Array.from({length:5}, () => Array(5).fill(''));
      inputs.forEach(inp => {
        const pos = inp.dataset.pos;
        if (!pos) return;
        const m = pos.match(/^r(\d)c(\d)$/);
        if (!m) return;
        const r = parseInt(m[1],10);
        const c = parseInt(m[2],10);
        grid[r][c] = inp.disabled ? 'FREE' : (inp.value || '').trim();
      });
      grid[2][2] = 'FREE';
      return grid;
    }

    // ✅ Updated generateCard function (no duplicate numbers per card)
    function generateCard(masterGrid, rand) {
      const pools = columnRanges.map(cr => createRange(cr.min, cr.max));
      pools.forEach((p, idx) => seededShuffle(p, rand));

      const usedNumbers = new Set();
      const card = Array.from({length:5}, () => Array(5).fill(''));

      for (let r = 0; r < 5; r++) {
        for (let c = 0; c < 5; c++) {
          if (r === 2 && c === 2) {
            card[r][c] = 'FREE';
            continue;
          }

          const override = masterGrid[r][c];
          if (override) {
            if (override !== 'FREE' && !usedNumbers.has(override)) {
              card[r][c] = override;
              usedNumbers.add(override);
            } else {
              let val;
              do {
                val = pools[c].pop();
              } while (usedNumbers.has(val) && pools[c].length > 0);
              card[r][c] = String(val);
              usedNumbers.add(val);
            }
          } else {
            let val;
            do {
              val = pools[c].pop();
            } while (usedNumbers.has(val) && pools[c].length > 0);
            card[r][c] = String(val);
            usedNumbers.add(val);
          }
        }
      }
      return card;
    }

    function renderCards(cards) {
      const container = document.getElementById('cards');
      container.innerHTML = '';
      cards.forEach((card, idx) => {
        const cardEl = document.createElement('div');
        cardEl.className = 'card';
        const title = document.createElement('h3');
        title.textContent = `Card ${idx + 1}`;
        cardEl.appendChild(title);

        const gridEl = document.createElement('div');
        gridEl.className = 'grid';
        for (let r = 0; r < 5; r++) {
          for (let c = 0; c < 5; c++) {
            const cell = document.createElement('div');
            cell.className = 'cell';
            if (r === 2 && c === 2) {
              cell.classList.add('free');
            } else {
              const text = card[r][c];
              if (text && isNaN(Number(text))) cell.classList.add('input-cell');
              else cell.classList.add('auto-cell');
            }
            cell.textContent = card[r][c];
            gridEl.appendChild(cell);
          }
        }
        cardEl.appendChild(gridEl);
        container.appendChild(cardEl);
      });
    }

    document.getElementById('generateBtn').addEventListener('click', () => {
      const count = Math.max(1, Math.min(100, parseInt(document.getElementById('cardsCount').value || '1', 10)));
      const seedInput = (document.getElementById('seed').value || '').trim();
      let numericSeed;
      if (seedInput === '') {
        numericSeed = Math.floor(Math.random() * 4294967295);
      } else {
        numericSeed = cyrb53(seedInput) >>> 0;
      }
      const rand = mulberry32(numericSeed);
      const master = readMasterGrid();
      const cards = [];
      for (let i = 0; i < count; i++) {
        const cardSeed = (numericSeed + i + 1) >>> 0;
        const cardRand = mulberry32(cardSeed);
        const card = generateCard(master, cardRand);
        cards.push(card);
      }
      renderCards(cards);
    });

    function cyrb53(str, seed = 0) {
      let h1 = 0xDEADBEEF ^ seed, h2 = 0x41C6CE57 ^ seed;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return 4294967296 * (2097151 & h2) + (h1 >>> 0);
    }

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('generateBtn').click();
    });
  </script>
</body>
</html>
